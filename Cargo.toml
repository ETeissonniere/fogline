[package]
name = "fogline"
version = "0.4.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
icalendar = { version = "0.17.13", features = ["recurrence"] }
iso8601 = "0.6"
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
strip = true
